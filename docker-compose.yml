services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Script executado automaticamente na primeira vez que o container
      # cria o volume (não roda de novo se o volume já existir)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z

volumes:
  db_data: